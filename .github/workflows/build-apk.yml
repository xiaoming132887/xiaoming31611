name: Build APK (debug)

# 推送到主分支或手动触发，都会在云端构建一个 debug APK，
# 不需要本地 Flutter 环境，也不需要签名密钥。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.3

      # Android 端必须的 native 依赖，官方 CI 也是从这里下的
      - name: 下载 mobile.aar
        run: |
          mkdir -p openlist_background_service/android/libs
          curl -L --retry 5 --retry-all-errors -o openlist_background_service/android/libs/mobile.aar \
            https://github.com/OpenListApp/OpenListLib/releases/latest/download/mobile.aar

      - name: 拉依赖
        run: flutter pub get

      - name: 构建 debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
